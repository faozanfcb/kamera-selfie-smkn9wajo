
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Selfie - SMKN 9 Wajo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 24px auto;
      padding: 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    video, img {
      width: 100%;
      border-radius: 12px;
      background: #222;
      margin-top: 12px;
    }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Foto Selfie Siswa</h1>
  <p>SMKN 9 Wajo</p>
  <p id="status">Menunggu halaman absensi terhubung...</p>

  <video id="video" autoplay muted playsinline hidden></video>
  <img id="preview" alt="Pratinjau foto selfie" hidden>
  <canvas id="canvas" hidden></canvas>

  <div>
    <button id="capture" hidden>Ambil Foto</button>
    <button id="retake" hidden>Ulangi Foto</button>
    <button id="send" hidden>Kirim Foto ke Absensi</button>
    <button id="close">Tutup Kamera</button>
  </div>

  <script>
    const PARENT_ORIGIN = 'https://faozanfcb.github.io';

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const statusBox = document.getElementById('status');
    const captureButton = document.getElementById('capture');
    const retakeButton = document.getElementById('retake');
    const sendButton = document.getElementById('send');
    const closeButton = document.getElementById('close');

    let stream = null;
    let photoData = '';
    let connected = false;

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
    }

    async function openCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        statusBox.textContent =
          'Akses kamera tidak tersedia. Pastikan halaman menggunakan HTTPS.';
        return;
      }

      try {
        statusBox.textContent = 'Meminta izin kamera...';
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        video.hidden = false;
        preview.hidden = true;
        await video.play();

        captureButton.hidden = false;
        statusBox.textContent =
          'Kamera aktif. Posisikan wajah di tengah, lalu ambil foto.';
      } catch (error) {
        statusBox.textContent =
          'Kamera gagal dibuka: ' + error.name + '\n' + error.message;
      }
    }

    window.addEventListener('message', async event => {
  if (event.origin !== PARENT_ORIGIN) {
    statusBox.textContent =
      'Pesan ditolak: asal pengirim tidak sesuai.';
    return;
  }

  if (event.source !== window.opener) {
    statusBox.textContent =
      'Pesan ditolak: jendela pembuka tidak sesuai.';
    return;
  }

  if (event.data?.type === 'ABSENSI_START_CAMERA') {
    connected = true;
    statusBox.textContent = 'Perintah diterima. Membuka kamera...';
    await openCamera();
  }
});

    captureButton.addEventListener('click', () => {
      if (!stream || !video.videoWidth) {
        statusBox.textContent = 'Kamera belum siap.';
        return;
      }

      const scale = Math.min(1, 1280 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      canvas.getContext('2d').drawImage(
        video, 0, 0, canvas.width, canvas.height
      );

      photoData = canvas.toDataURL('image/jpeg', 0.75);
      preview.src = photoData;
      preview.hidden = false;
      video.hidden = true;

      stopCamera();
      captureButton.hidden = true;
      retakeButton.hidden = false;
      sendButton.hidden = false;

      statusBox.textContent =
        'Foto siap ditinjau. Foto belum dikirim atau disimpan.';
    });

    retakeButton.addEventListener('click', async () => {
      photoData = '';
      preview.removeAttribute('src');
      preview.hidden = true;
      retakeButton.hidden = true;
      sendButton.hidden = true;
      await openCamera();
    });

    sendButton.addEventListener('click', () => {
      if (!connected || !window.opener || !photoData) {
        statusBox.textContent =
          'Halaman absensi belum terhubung atau foto belum tersedia.';
        return;
      }

      window.opener.postMessage({
        type: 'ABSENSI_PHOTO_CAPTURED',
        photo: photoData
      }, PARENT_ORIGIN);

      sendButton.disabled = true;
      statusBox.textContent =
        'Foto telah dikirim ke halaman pembuka. Tunggu konfirmasi.';
    });

    closeButton.addEventListener('click', () => {
      stopCamera();
      window.close();
      statusBox.textContent = 'Kamera ditutup.';
    });

    window.addEventListener('pagehide', stopCamera);

    if (window.opener) {
      window.opener.postMessage({
        type: 'ABSENSI_CAMERA_READY'
      }, PARENT_ORIGIN);

      statusBox.textContent =
        'Halaman kamera terbuka. Menunggu perintah dari halaman absensi.';
    } else {
      statusBox.textContent =
        'Buka halaman ini melalui tombol di halaman absensi.';
    }
  </script>
</body>
</html>
