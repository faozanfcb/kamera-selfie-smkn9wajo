
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uji Kamera - SMKN 9 Wajo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 30px auto;
      padding: 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      cursor: pointer;
    }
    video {
      width: 100%;
      margin-top: 16px;
      background: #222;
      border-radius: 12px;
    }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Uji Kamera Selfie</h1>
  <p>SMKN 9 Wajo — pengujian kamera saja.</p>

  <button id="start">Buka Kamera Depan</button>
  <button id="stop" disabled>Tutup Kamera</button>

  <p id="status">Tekan tombol untuk menguji kamera.</p>
  <video id="video" autoplay muted playsinline></video>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const start = document.getElementById('start');
    const stop = document.getElementById('stop');
    let stream = null;

    start.addEventListener('click', async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent =
          'Akses kamera tidak tersedia. Pastikan halaman dibuka melalui HTTPS.';
        return;
      }

      start.disabled = true;
      status.textContent = 'Meminta izin kamera...';

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'user' }
        });

        video.srcObject = stream;
        await video.play();
        stop.disabled = false;
        status.textContent =
          'BERHASIL: kamera aktif. Foto belum diambil atau disimpan.';
      } catch (error) {
        status.textContent =
          'Kamera gagal dibuka.\n' +
          'Jenis kesalahan: ' + error.name + '\n' +
          'Pesan: ' + error.message;
      } finally {
        start.disabled = false;
      }
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      stop.disabled = true;
      status.textContent = 'Kamera telah ditutup.';
    }

    stop.addEventListener('click', stopCamera);
    window.addEventListener('pagehide', () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
